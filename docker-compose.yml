# Caffe Cool — MySQL + API + static frontend
#
# Start:  docker compose up -d --build
# Stop:   docker compose down          (data kept)
# Wipe:   docker compose down -v       (deletes MySQL data!)

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cafecool_root}
      MYSQL_DATABASE: cafecool
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-cafecool_root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cafecool_root}
      DB_DATABASE: cafecool
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../caffe-cool
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql_data:
